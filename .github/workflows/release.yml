name: Build and Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DeepSeekBalanceMonitor-windows
            sep: ";"
            icon_args: --icon=deepseek-balance-monitor.ico
          - os: macos-latest
            artifact_name: DeepSeekBalanceMonitor-macos
            sep: ":"
            icon_args: ""
          - os: ubuntu-latest
            artifact_name: DeepSeekBalanceMonitor-linux
            sep: ":"
            icon_args: ""
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd main
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build executable (onedir, PySide6)
        run: |
          cd main
          pyinstaller --onedir --windowed --name "DeepSeekBalanceMonitor" ${{ matrix.icon_args }} --add-data "themes${{ matrix.sep }}themes" --add-data "../assets/icon.png${{ matrix.sep }}assets" main.py
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path main/dist/DeepSeekBalanceMonitor -DestinationPath main/dist/${{ matrix.artifact_name }}.zip
      - name: Package artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd main/dist
          zip -qry ../${{ matrix.artifact_name }}.zip DeepSeekBalanceMonitor
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: main/dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  # ISSUE-PKG-03：三平台 matrix job 并行直传 Release 存在竞态（v2.0.0 首发只落了
  # windows.zip，macos/linux 包被静默丢弃）。收口为单一 release job：build 各自
  # 上传工作区工件，全部成功后由一个 job 合并三包、一次性发布。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
